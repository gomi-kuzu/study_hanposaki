version: '3.8'

services:
  manim:
    build: ./docker_example/
    container_name: manim-container
    volumes:
      - "./manim_src:/manim:z"
    command: /bin/bash
    stdin_open: true
    tty: true
    working_dir : /manim/
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility