[CLI]
write_to_movie = True
background_color = BLACK
# デフォルトの品質を中品質（720p30）に設定
quality = medium_quality
# デフォルトはMP4形式
# MOVが必要な場合: manim --format=mov <file> <scene>
# GIFが必要な場合: manim -i または -iql <file> <scene>

# GPU加速設定（OpenGLレンダラー使用）
# GPUレンダリングを有効にするには: manim --renderer=opengl <file> <scene>
# または下記のコメントアウトを解除してデフォルト設定に
renderer = opengl